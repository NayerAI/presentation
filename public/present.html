<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Presentation</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="icon" href="/img/logo.png" />
  </head>
  <body class="stage-body">
    <div id="stage" class="stage">
      <!-- Rendered slide -->
      <canvas id="slideCanvas" class="slide-canvas"></canvas>

      <!-- Idle / waiting screen -->
      <div id="idleScreen" class="overlay idle-screen">
        <div class="idle-inner">
          <div class="idle-mark">🖥️</div>
          <h1>Ready for your presentation</h1>
          <p>Keep this tab open on your presentation screen. It will start automatically.</p>
        </div>
      </div>

      <!-- Countdown overlay -->
      <div id="countdownScreen" class="overlay countdown-screen" hidden>
        <svg class="countdown-ring" viewBox="0 0 120 120">
          <circle class="ring-bg" cx="60" cy="60" r="54" />
          <circle id="ringProgress" class="ring-progress" cx="60" cy="60" r="54" />
        </svg>
        <div id="countdownNumber" class="countdown-number">3</div>
      </div>

      <!-- Final "Thank you!" slide with confetti -->
      <div id="finishScreen" class="overlay finish-screen" hidden>
        <div class="finish-inner">
          <div class="finish-emoji">🎉</div>
          <h1 class="pixel-title">Thank you!</h1>
        </div>
      </div>

      <!-- Paused badge -->
      <div id="pausedBadge" class="paused-badge" hidden>❚❚ Paused</div>

      <!-- Thin auto-advance progress bar along the bottom -->
      <div id="stageProgress" class="stage-progress" hidden><div id="stageProgressFill"></div></div>

      <!-- Fullscreen control (auto-hides) -->
      <button id="fsBtn" class="fs-btn" title="Toggle fullscreen">⛶</button>
    </div>

    <script type="module" src="/js/present.js"></script>
  </body>
</html>
